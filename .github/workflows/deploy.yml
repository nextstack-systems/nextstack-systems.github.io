name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install pnpm first before configuring Node caching
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Change this to match your local major version if needed

      # 2. Configure Node and point the native engine cache to pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # Changed from 'npm' to 'pnpm'

      # 3. Clean install relying strictly on pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Trigger the pnpm production bundle compiler
      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
